# Local PostgreSQL test database (create it once: CREATE DATABASE clinic_test;)
# DB_USER / DB_PASSWORD still come from the environment (see application.properties).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/clinic_test}

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
app.admin-email=admin@test.example
