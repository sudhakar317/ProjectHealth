spring.application.name=clinic
server.port=8080
# Behind the Vite dev proxy / a reverse proxy: build redirect URIs from forwarded headers
server.forward-headers-strategy=framework

# Database (local PostgreSQL). DB_PASSWORD has no default on purpose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinic}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Google OAuth2 / OIDC (no defaults: must be provided via environment)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# The protected admin, auto-created as ADMIN on startup and never demotable (rules.md 5.3). Set
# ADMIN_EMAIL in each environment; the fallback keeps an existing local setup working unchanged.
app.admin-email=${ADMIN_EMAIL:sudhakarsakthivel31@gmail.com}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Server-side session cookie. Secure by default, so a production deploy that forgets the variable
# fails safe; plain-http local development turns it off in the local profile.
# SameSite=lax rather than strict: strict would drop the cookie on the redirect back from Google.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# Idle timeout (rules.md 5.9): a clinic workstation left unlocked should not stay signed in for hours.
server.servlet.session.timeout=30m

# Never put stack traces or exception text in a response; ApiExceptionHandler shapes every error.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Every log line carries the request id, the same one the user sees in an error message.
logging.pattern.level=%5p [%X{requestId:-}]
