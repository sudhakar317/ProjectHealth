spring.application.name=clinic
server.port=8080
# Behind the Vite dev proxy / a reverse proxy: build redirect URIs from forwarded headers
server.forward-headers-strategy=framework

# Database (local PostgreSQL). DB_PASSWORD has no default on purpose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinic}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Google OAuth2 / OIDC (no defaults: must be provided via environment)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Hardcoded admin (auto-created as ADMIN on startup)
app.admin-email=sudhakarsakthivel31@gmail.com
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Server-side session cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=8h
